<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Sherlock demo video preview</title>
  <desc id="desc">Preview card for the Sherlock Live Candidate Identity Demo video.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f" />
      <stop offset="0.55" stop-color="#0e2231" />
      <stop offset="1" stop-color="#07111f" />
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1b2b" />
      <stop offset="1" stop-color="#132b38" />
    </linearGradient>
    <style>
      .title { fill: #edf5ff; font: 700 56px Arial, sans-serif; }
      .label { fill: #60a5fa; font: 700 20px Arial, sans-serif; letter-spacing: 1px; }
      .text { fill: #dbe7f5; font: 28px Arial, sans-serif; }
      .small { fill: #9fb0c7; font: 22px Arial, sans-serif; }
      .tiny { fill: #9fb0c7; font: 18px Arial, sans-serif; }
      .panel { fill: url(#panel); stroke: #2f4562; stroke-width: 2; rx: 20; }
      .card { fill: #101c2d; stroke: #2f4562; stroke-width: 2; rx: 16; }
      .green { fill: #34d399; }
      .blue { fill: #60a5fa; }
      .amber { fill: #f59e0b; }
      .muted { fill: #1d2b40; }
      .barBg { fill: #27364b; }
      .barFill { fill: #34d399; }
    </style>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)" />
  <rect x="36" y="34" width="1208" height="652" class="panel" />

  <text x="72" y="88" class="label">SHERLOCK CANDIDATE IDENTITY FUSION ENGINE</text>
  <text x="72" y="154" class="title">Live Candidate Identity Demo</text>
  <text x="72" y="204" class="text">Deterministic fusion engine for selecting the real interview candidate stream.</text>

  <rect x="72" y="258" width="420" height="300" class="card" />
  <text x="104" y="310" class="label">LIVE DECISION SUMMARY</text>
  <text x="104" y="362" class="small">Selected candidate stream</text>
  <text x="104" y="414" class="text" style="font-weight:700">Ritika Gupta / p_candidate</text>
  <text x="104" y="462" class="small">State: LIKELY_CANDIDATE</text>
  <rect x="104" y="500" width="320" height="18" rx="9" class="barBg" />
  <rect x="104" y="500" width="272" height="18" rx="9" class="barFill" />
  <text x="104" y="546" class="text" style="font-weight:700">85% confidence</text>

  <rect x="530" y="258" width="312" height="300" class="card" />
  <text x="562" y="310" class="label">FUSION SIGNALS</text>
  <circle cx="582" cy="360" r="9" class="blue" />
  <text x="606" y="368" class="small">Metadata match</text>
  <circle cx="582" cy="410" r="9" class="green" />
  <text x="606" y="418" class="small">Transcript evidence</text>
  <circle cx="582" cy="460" r="9" class="amber" />
  <text x="606" y="468" class="small">Safety gates</text>
  <circle cx="582" cy="510" r="9" class="blue" />
  <text x="606" y="518" class="small">Behavior context</text>

  <rect x="880" y="258" width="300" height="300" class="card" />
  <text x="912" y="310" class="label">SCENARIO REPLAY</text>
  <text x="912" y="362" class="small">20 edge cases</text>
  <text x="912" y="410" class="small">Backend snapshots</text>
  <text x="912" y="458" class="small">Evidence trace</text>
  <text x="912" y="506" class="small">Evaluation metrics</text>

  <circle cx="640" cy="620" r="42" fill="#2563eb" />
  <path d="M628 597 L628 643 L666 620 Z" fill="#ffffff" />
  <text x="702" y="628" class="text" style="font-weight:700">Click to watch the demo video</text>
</svg>
