services:
  deps:
    image: oven/bun:1.3.2
    container_name: sherlock_deps
    working_dir: /app
    command: bun install --frozen-lockfile
    volumes:
      - .:/app
      - sherlock-node-modules:/app/node_modules
      - sherlock-bun-cache:/root/.bun/install/cache

  postgres:
    image: postgres:16
    container_name: sherlock_postgres
    environment:
      POSTGRES_USER: sherlock
      POSTGRES_PASSWORD: sherlock
      POSTGRES_DB: sherlock_dev
    ports:
      - "5432:5432"
    volumes:
      - sherlock-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sherlock -d sherlock_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: oven/bun:1.3.2
    container_name: sherlock_migrate
    working_dir: /app
    command: sh -lc "bun --filter '@sherlock/db' db:deploy && bun --filter '@sherlock/db' db:generate"
    environment:
      DATABASE_URL: postgresql://sherlock:sherlock@postgres:5432/sherlock_dev
    volumes:
      - .:/app
      - sherlock-node-modules:/app/node_modules
      - sherlock-bun-cache:/root/.bun/install/cache
    depends_on:
      deps:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  http:
    image: oven/bun:1.3.2
    container_name: sherlock_http
    working_dir: /app
    command: bun --filter http dev
    environment:
      HOST: 0.0.0.0
      PORT: 3001
      DATABASE_URL: postgresql://sherlock:sherlock@postgres:5432/sherlock_dev
      SHERLOCK_WEB_ORIGIN: http://localhost:3000
      ENABLE_LLM_TRANSCRIPT_CLASSIFIER: ${ENABLE_LLM_TRANSCRIPT_CLASSIFIER:-false}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
    ports:
      - "3001:3001"
    volumes:
      - .:/app
      - sherlock-node-modules:/app/node_modules
      - sherlock-bun-cache:/root/.bun/install/cache
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    image: oven/bun:1.3.2
    container_name: sherlock_web
    working_dir: /app
    command: sh -lc "cd apps/web && bun next dev --port 3000 --hostname 0.0.0.0"
    environment:
      NEXT_PUBLIC_SHERLOCK_API_URL: http://localhost:3001
      NEXT_PUBLIC_ENABLE_DEMO_MODE: "true"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - sherlock-node-modules:/app/node_modules
      - sherlock-bun-cache:/root/.bun/install/cache
    depends_on:
      deps:
        condition: service_completed_successfully
      http:
        condition: service_started

volumes:
  sherlock-postgres-data:
  sherlock-node-modules:
  sherlock-bun-cache:
